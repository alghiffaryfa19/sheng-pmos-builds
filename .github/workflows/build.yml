name: Xiaomi Pad 6s Pro postmarketOS
on:
  push: # Build when push
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5' # Start build every friday

jobs:
  build-image:
    strategy:
      matrix:
        version: ["default"]

    runs-on: ubuntu-latest
    steps:
      - name: Check out build configurations
        uses: actions/checkout@v4

      - name: Set current date variable
        run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
        
      - name: Create artifact directory
        run: |
            mkdir out
        
      - name: Substitute placeholders in configs
        run: |
           find . -type f -name "*.cfg" -exec sed -i "s|HOME|$(echo $HOME)|;s|NPROC|$(nproc)|" {} +

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          pmbootstrap --version


      - name: Set up pmaports
        run: |
          mkdir -p ~/.config
          cp xiaomi-sheng.cfg ~/.config/pmbootstrap_v3.cfg
      
          PMB_WORK="$HOME/.local/var/pmbootstrap"
          PMAPORTS="$PMB_WORK/cache_git/pmaports"
      
          rm -rf "$PMAPORTS"
          mkdir -p "$(dirname "$PMAPORTS")"
      
          # Clone upstream resmi agar pmbootstrap tetap mengenali pmaports
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS"
      
          cd "$PMAPORTS"
      
          # Tambahkan fork kamu
          git remote add sheng https://gitlab.postmarketos.org/alghiffaryfa19/pmaports.git
      
          # Ambil branch dari fork kamu
          git fetch --depth=1 sheng master
      
          # Pakai isi fork kamu, tapi remote origin tetap upstream resmi
          git checkout -B master FETCH_HEAD
      
          git remote -v
          git branch --show-current
      
          test -d device/testing/device-xiaomi-sheng || find device -maxdepth 3 -name "*sheng*"
      
          yes "" | pmbootstrap --details-to-stdout --aports "$PMAPORTS" init
      
          pmbootstrap status


      - name: Install zstd in chroot
        run: |
          pmbootstrap chroot -- apk add zstd

      - name: Build the xiaomi-sheng without DE
        run: |
           pmbootstrap checksum device-xiaomi-sheng
           pmbootstrap checksum firmware-xiaomi-sheng
           pmbootstrap checksum linux-postmarketos-qcom-sm8550
           cat ~/.local/var/pmbootstrap/cache_git/pmaports/device/testing/linux-postmarketos-qcom-sm8550/APKBUILD
           pmbootstrap install --password 147147
           pmbootstrap chroot --image -r -- sh -s <<'EOF'
           set -eu
      
           fix_exec() {
             path="$1"
             label="$2"
      
             if [ -f "$path" ]; then
               chmod 0755 "$path"
               echo "✓ $label permissions fixed"
             else
               echo "  $path not found, skipped"
             fi
           }
      
           fix_exec "/usr/bin/adsprpcd" "adsprpcd"
           fix_exec "/usr/libexec/iio-sensor-proxy" "iio-sensor-proxy"
           fix_exec "/usr/bin/monitor-sensor" "monitor-sensor"
           fix_exec "/usr/bin/ssccli" "ssccli"
      
           if command -v systemctl >/dev/null 2>&1; then
             if [ -f /usr/lib/systemd/system/adsprpcd-sensorspd.service ] || \
                [ -f /etc/systemd/system/adsprpcd-sensorspd.service ]; then
               systemctl enable adsprpcd-sensorspd.service
               echo "✓ adsprpcd-sensorspd.service enabled"
             else
               echo "  adsprpcd-sensorspd.service not found, skipped"
             fi
           else
             echo "  systemctl not found, skipped"
           fi
           EOF
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-sheng.img
           cp /tmp/postmarketOS-export/xiaomi-sheng.img out/rootfs-xiaomi-sheng-none.img

      - name: Show log
        if: always()
        run: |
          cat /home/runner/.local/var/pmbootstrap/log.txt

      - name: Breakpoint if tests failed for xiaomi-sheng without DE
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: alghiffaryfa19
      
      - name: Upload artifacts xiaomi-sheng without DE
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-none_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7

      - name: Build the xiaomi-sheng with KDE Plasma Desktop
        run: |
           yes | pmbootstrap zap
           rm -r out/*
           pmbootstrap install --password 147147 --add postmarketos-ui-plasma-desktop
           cat /home/runner/.local/var/pmbootstrap/log.txt
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-sheng.img
           cp /tmp/postmarketOS-export/xiaomi-sheng.img out/rootfs-xiaomi-sheng-plasma.img

      - name: Breakpoint if tests failed for xiaomi-sheng with KDE Plasma Desktop
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: alghiffaryfa19
      
      - name: Upload artifacts xiaomi-sheng with KDE Plasma Desktop
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-plasma_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7


      - name: Build the xiaomi-sheng with KDE Plasma Mobile
        run: |
           yes | pmbootstrap zap
           rm -r out/*
           pmbootstrap install --password 147147 --add postmarketos-ui-plasma-mobile
           cat /home/runner/.local/var/pmbootstrap/log.txt
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-sheng.img
           cp /tmp/postmarketOS-export/xiaomi-sheng.img out/rootfs-xiaomi-sheng-plasma-mobile.img

      - name: Breakpoint if tests failed for xiaomi-sheng with KDE Plasma Mobile
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: alghiffaryfa19
      
      - name: Upload artifacts xiaomi-sheng with KDE Plasma Mobile
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-plasma_mobile_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7

      - name: Build the xiaomi-sheng with Lomiri
        run: |
           yes | pmbootstrap zap
           rm -r out/*
           pmbootstrap install --password 147147 --add postmarketos-ui-lomiri
           cat /home/runner/.local/var/pmbootstrap/log.txt
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-sheng.img
           cp /tmp/postmarketOS-export/xiaomi-sheng.img out/rootfs-xiaomi-sheng-lomiri.img

      - name: Breakpoint if tests failed for xiaomi-sheng with Lomiri
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: alghiffaryfa19
      
      - name: Upload artifacts xiaomi-sheng with Lomiri
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-lomiri_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7
            
      - name: Build the xiaomi-sheng with GNOME
        run: |
           yes | pmbootstrap zap
           rm -r out/*
           pmbootstrap install --password 147147 --add postmarketos-ui-gnome
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-sheng.img
           cp /tmp/postmarketOS-export/xiaomi-sheng.img out/rootfs-xiaomi-sheng-gnome.img

      - name: Breakpoint if tests failed for xiaomi-sheng with GNOME
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: alghiffaryfa19
            
      - name: Upload artifacts xiaomi-sheng with GNOME
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-gnome_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7


      
      - name: Build the xiaomi-sheng with GNOME Mobile
        run: |
           yes | pmbootstrap zap
           rm -r out/*
           pmbootstrap install --password 147147 --add postmarketos-ui-gnome-mobile
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-sheng.img
           cp /tmp/postmarketOS-export/xiaomi-sheng.img out/rootfs-xiaomi-sheng-gnome-mobile.img

      - name: Breakpoint if tests failed for xiaomi-sheng with GNOME Mobile
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: alghiffaryfa19
            
      - name: Upload artifacts xiaomi-sheng with GNOME Mobile
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-gnome-mobile_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7
                       
      - name: Copy xiaomi-sheng kernel
        run: |
           rm -r out/*
           cp ~/.local/var/pmbootstrap/packages/edge/aarch64/linux-postmarketos-qcom-sm8550-*.apk out/
      
      - name: Upload artifacts xiaomi-sheng kernel
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-sheng-kernel_${{ env.CURRENT_DATE }}
           path: out/*.apk
           retention-days: 7



        

        
